<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Green Screen Page</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        height: 100vh;
        display: flex;
        flex-direction: column;
        font-family: Arial, sans-serif;
      }

      header {
        height: 10%;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #680707;
        color: white;
        font-size: 28px;
        font-weight: bold;
      }

      main {
        height: 40%;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #285228;
      }

      .green-screen {
        width: 70%;
        height: 80%;
        background-color: #285228;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 30px;
        font-weight: bold;
        color: black;
      }

      footer {
        height: 10%;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #680707;
        color: white;
        font-weight: bold;
        font-size: 28px;
      }
    </style>
  </head>

  <body>
    <header>HEADER</header>

    <main>
      <div class="green-screen"></div>
    </main>

    <footer>FOOTER</footer>
  </body>
</html>
